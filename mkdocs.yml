site_name: Node Goblin
site_description: Install, pair, and operate remote execution hosts for Burrow
site_url: https://GoblinKing-Burrow.github.io/Node-Goblin/
repo_url: https://github.com/GoblinKing-Burrow/Node-Goblin
repo_name: GoblinKing-Burrow/Node-Goblin
edit_uri: ""
strict: true

theme:
  name: material
  language: en
  logo: assets/node-goblin-logo.png
  favicon: assets/node-goblin-logo.png
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
extra_css:
  - assets/stylesheets/extra.css

# Internal historical repair notes are not part of the user documentation or search index.
exclude_docs: |
  audit-repair-pass-5.md
  repairs/

nav:
  - Home: index.md
  - User guide:
      - Install Node Goblin: installation.md
      - Pair and assign a host: pairing.md
      - Settings: settings.md
      - Operations and troubleshooting: operations.md
      - Security and trust: security.md
  - Reference:
      - Configuration: configuration.md
      - Operator commands: cli.md
      - Architecture: architecture.md
      - Native filesystem: filesystem.md
      - HTTP API: api.md
      - Wire protocol: protocol.md
  - About this release:
      - Source and coverage: source-map.md
      - Development and documentation: development.md
