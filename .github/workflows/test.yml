name: Runtime contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: gateway
      - name: Check release identity
        run: node gateway/deploy/set-release-version.mjs "$(cat gateway/VERSION)" --check
