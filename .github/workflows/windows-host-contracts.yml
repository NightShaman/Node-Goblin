name: Windows gateway contracts
on:
  push:
    branches: [hatchet/windows-node-goblin]
  pull_request:
    paths: ['gateway/**', 'server/**', '.github/workflows/windows-host-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    timeout-minutes: 10
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise Windows host primitives over real pairing and TLS
        shell: pwsh
        run: |
          if (-not (Get-Command openssl.exe -ErrorAction SilentlyContinue)) {
            $env:Path = "$env:ProgramFiles\Git\usr\bin;$env:Path"
          }
          node --test gateway/test/windows-host.test.mjs gateway/test/windows-bootstrap.test.mjs gateway/test/windows-launcher.test.mjs
      - name: Try a disposable standard Windows user in the runner desktop
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/hatchet/windows-node-goblin' }}
        shell: pwsh
        run: |
          $owner = 'ngci' + [Guid]::NewGuid().ToString('N').Substring(0,12)
          $work = Join-Path $env:PUBLIC $owner
          $source = (Resolve-Path 'gateway/test/windows-desktop-probe.ps1').Path
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $result = Join-Path $work 'result.json'
          $pw = ('Ng9!' + [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')) | ConvertTo-SecureString -AsPlainText -Force
          $user = $null; $proc = $null
          try {
            $user = New-LocalUser -Name $owner -Password $pw -ErrorAction Stop
            New-Item -Path $work -ItemType Directory -ErrorAction Stop | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $work 'probe.ps1')
            & icacls.exe $work '/inheritance:r' '/grant:r' ('*' + $user.Sid.Value + ':(OI)(CI)(M)') '*S-1-5-32-544:(OI)(CI)(F)' '*S-1-5-18:(OI)(CI)(F)' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not protect fixture directory' }
            $cred = [PSCredential]::new("$env:COMPUTERNAME\$owner", $pw)
            $proc = Start-Process -PassThru -FilePath $winps -Credential $cred -WorkingDirectory $work -ArgumentList @('-NoProfile','-NonInteractive','-Sta','-ExecutionPolicy','Bypass','-File','probe.ps1','-ResultPath','result.json') -ErrorAction Stop
            if (-not $proc.WaitForExit(15000)) { throw 'Standard-user probe timed out' }
            if (Test-Path -LiteralPath $result) { Write-Output "Standard user desktop: $(Get-Content -LiteralPath $result -Raw)" }
            else { Write-Output "Standard user desktop: no receipt (exit code: $($proc.ExitCode))" }
          } catch { Write-Output "Standard user desktop unavailable: $($_.Exception.Message)" }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($user) { Remove-LocalUser -SID $user.Sid -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          }
