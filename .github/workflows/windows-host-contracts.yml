name: Windows gateway contracts
on:
  push:
    branches: [hatchet/windows-node-goblin]
  pull_request:
    paths: ['gateway/**', 'server/**', '.github/workflows/windows-host-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    timeout-minutes: 15
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise Windows host primitives over real pairing and TLS
        shell: pwsh
        run: |
          if (-not (Get-Command openssl.exe -ErrorAction SilentlyContinue)) {
            $env:Path = "$env:ProgramFiles\Git\usr\bin;$env:Path"
          }
          node --test --test-reporter=tap gateway/test/windows-host.test.mjs gateway/test/windows-bootstrap.test.mjs gateway/test/windows-launcher.test.mjs
      - name: Require the full desktop slice as a disposable standard Windows user
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/hatchet/windows-node-goblin' }}
        shell: pwsh
        run: |
          $owner = 'ngci' + [Guid]::NewGuid().ToString('N').Substring(0,12)
          $work = Join-Path $env:PUBLIC $owner
          $source = (Resolve-Path 'gateway/test/windows-desktop-probe.ps1').Path
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $result = Join-Path $work 'result.json'
          $pw = ('Ng9!' + [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')) | ConvertTo-SecureString -AsPlainText -Force
          $user = $null; $proc = $null
          try {
            $user = New-LocalUser -Name $owner -Password $pw -ErrorAction Stop
            New-Item -Path $work -ItemType Directory -ErrorAction Stop | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $work 'probe.ps1')
            Copy-Item -LiteralPath (Get-Command node.exe -CommandType Application | Select-Object -First 1).Path -Destination (Join-Path $work 'node.exe')
            Copy-Item -Path gateway,server -Recurse -Destination $work
            & icacls.exe $work '/inheritance:r' '/grant:r' ('*' + $user.Sid.Value + ':(OI)(CI)(M)') '*S-1-5-32-544:(OI)(CI)(F)' '*S-1-5-18:(OI)(CI)(F)' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not protect fixture directory' }
            $cred = [PSCredential]::new("$env:COMPUTERNAME\$owner", $pw)
            $proc = Start-Process -PassThru -FilePath $winps -Credential $cred -LoadUserProfile -WorkingDirectory $work -ArgumentList @('-NoProfile','-NonInteractive','-Sta','-ExecutionPolicy','Bypass','-File','probe.ps1','-ResultPath','result.json','-ExerciseGateway') -ErrorAction Stop
            if (-not $proc.WaitForExit(360000)) { throw 'Standard-user probe timed out' }
            if (-not (Test-Path -LiteralPath $result)) { throw "Standard-user desktop did not record a receipt (exit $($proc.ExitCode))" }
            $surface = Get-Content -LiteralPath $result -Raw
            Write-Output "Standard user desktop: $surface"
            $packageLog = Join-Path $work 'packaging-e2e.log'
            if (Test-Path -LiteralPath $packageLog) { Get-Content -LiteralPath $packageLog }
            $desktopLog = Join-Path $work 'desktop-e2e.log'
            if (Test-Path -LiteralPath $desktopLog) { Get-Content -LiteralPath $desktopLog }
            if ($proc.ExitCode -ne 0) { throw "Desktop integration failed ($($proc.ExitCode))" }
            if (($surface | ConvertFrom-Json).state -ne 'interactive_non_elevated_capture_verified') { throw 'Standard-user app pixels were not verified' }
            foreach ($marker in 'NG_WINDOWS_INSTALLED_LAUNCHER_VERIFIED', 'NG_WINDOWS_DESKTOP_APP_INVOKED', 'NG_WINDOWS_DESKTOP_STOP_VERIFIED', 'NG_WINDOWS_DESKTOP_DISCONNECT_VERIFIED', 'NG_WINDOWS_DESKTOP_E2E_VERIFIED') {
              if (-not (Test-Path -LiteralPath $desktopLog) -or -not (Select-String -LiteralPath $desktopLog -Pattern "^# ${marker}: " -Quiet)) { throw "Desktop integration proof missing: $marker" }
            }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($user) { Remove-LocalUser -SID $user.Sid -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          }
