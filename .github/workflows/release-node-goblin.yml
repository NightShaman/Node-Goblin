name: Release Node Goblin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-goblin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assign calendar version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base=$(date -u +%Y.%m.%d)
          version=$base
          suffix=0
          while gh release view "v$version" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            version="$base.$suffix"
          done
          printf '%s\n' "$version" > gateway/VERSION
          node -e "const fs=require('fs'); const p='burrow.mod.json'; const manifest=JSON.parse(fs.readFileSync(p)); manifest.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(manifest, null, 2)+'\\n');" "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify and build release assets
        run: |
          set -eu
          (cd gateway && npm test)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) gateway/deploy/build-release.sh gateway/dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "Node Goblin $VERSION" \
            --notes "Calendar-versioned Node Goblin release $VERSION from source $GITHUB_SHA." \
            "gateway/dist/node-goblin-$VERSION.tar.gz" \
            "gateway/dist/node-goblin-$VERSION.tar.gz.sha256"
      # Burrow's assembly workflow independently consumes this public repo.
      # Keep dispatch available when the optional cross-repo token is configured,
      # but do not fail a standalone Node Goblin release when it is absent.
      - name: Dispatch public Burrow release
        if: ${{ env.BURROW_DISPATCH_TOKEN != '' }}
        env:
          BURROW_DISPATCH_TOKEN: ${{ secrets.BURROW_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.BURROW_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          gh api repos/NightShaman/Burrow/dispatches \
            --method POST \
            -f event_type=source-updated \
            -f client_payload[source_repository]="$GITHUB_REPOSITORY" \
            -f client_payload[source_sha]="$GITHUB_SHA" \
            -f client_payload[node_goblin_version]="$VERSION"
