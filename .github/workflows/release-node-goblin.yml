name: Verify Node Goblin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-goblin-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fast development contract gate
        working-directory: gateway
        run: |
          node --test client.test.mjs process-runner.test.mjs filesystem-runner.test.mjs network-transport.test.mjs protected-e2e.test.mjs
          node deploy/set-release-version.mjs "$(cat VERSION)" --check
