name: Build Node Goblin development package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-goblin-development-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fast development contract gate
        working-directory: gateway
        run: |
          node --test otel-runtime.test.mjs otel-transport.test.mjs otel-replay-upgrade.test.mjs client.test.mjs process-runner.test.mjs filesystem-runner.test.mjs network-transport.test.mjs protected-e2e.test.mjs test/bootstrap.test.mjs test/development-release-workflow.test.mjs test/update.test.mjs test/windows-manager.test.mjs
          node deploy/set-release-version.mjs "$(cat VERSION)" --check
      - name: Assign calendar version
        id: version
        run: |
          set -eu
          base=$(date -u +%Y.%m.%d)
          version=$base
          suffix=0
          while git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            version="$base.$suffix"
          done
          node gateway/deploy/set-release-version.mjs "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Freeze version-stamped source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burrow.mod.json gateway/VERSION gateway/package.json
          git diff --cached --quiet || git commit -m "Release Node Goblin $VERSION"
          git push origin HEAD:main
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build deterministic development package
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) gateway/deploy/build-release.sh gateway/dist
          node gateway/deploy/set-release-version.mjs "${{ steps.version.outputs.version }}" --check
      - uses: actions/upload-artifact@v4
        with:
          name: node-goblin-linux-package
          path: |
            gateway/dist/*.tar.gz
            gateway/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    uses: ./.github/workflows/windows-installer.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source }}

  publish:
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: node-goblin-linux-package
          path: gateway/dist
      - uses: actions/download-artifact@v4
        with:
          name: node-goblin-windows-installer
          path: gateway/dist
      - name: Publish development package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          set -eu
          (cd gateway/dist && sha256sum -c "node-goblin-$VERSION.tar.gz.sha256" && sha256sum -c "node-goblin-$VERSION-windows-x64-setup.exe.sha256")
          test "$(git rev-parse HEAD)" = "$SOURCE"
          tag="v$VERSION"
          git tag "$tag" "$SOURCE"
          git push origin "$tag"
          gh release create "$tag" \
            --title "Node Goblin $VERSION (development)" \
            --notes "Development package $VERSION from source $SOURCE. Windows x64: download the Setup.exe; Node.js is bundled, no terminal or separate runtime install is required. Per-user background operation starts at Windows sign-in only when opted in. Desktop access is separate and off on restart. Installer verification covers GUI pairing, real PowerShell/files, desktop opt-in/revocation, upgrade and uninstall on a disposable standard-user Windows session. The installer is unsigned; Windows may display an unknown-publisher warning. Linux packaging is unchanged. Complete public promotion runs separately." \
            "gateway/dist/node-goblin-$VERSION.tar.gz" \
            "gateway/dist/node-goblin-$VERSION.tar.gz.sha256" \
            "gateway/dist/node-goblin-$VERSION-windows-x64-setup.exe" \
            "gateway/dist/node-goblin-$VERSION-windows-x64-setup.exe.sha256"
