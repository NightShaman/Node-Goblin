name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs*.txt'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs*.txt'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-docs-test.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt -r requirements-docs-test.txt
      - name: Fast documentation gate
        run: |
          python -m mkdocs build --strict
          python scripts/docs/check_site.py site
      - name: Upload static documentation
        if: github.repository == 'GoblinKing-Burrow/Node-Goblin' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.repository == 'GoblinKing-Burrow/Node-Goblin' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: syntax
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v4
