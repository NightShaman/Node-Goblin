<!doctype html>
<html lang="en" data-surface="settings">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Nodes Settings</title>
    <link rel="stylesheet" href="./mod.css" />
  </head>
  <body>
    <main class="surface" aria-labelledby="page-title">
      <header class="page-header">
        <div>
          <p class="eyebrow">Remote Burrow Nodes</p>
          <h1 id="page-title">Remote Nodes</h1>
          <p class="lede">Configure the headless Burrow runtimes available to this instance.</p>
        </div>
        <button class="button button-primary" id="add-node" type="button">Add node</button>
      </header>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <section id="node-list" class="node-list" aria-label="Configured remote nodes" aria-busy="true"></section>
    </main>

    <dialog id="node-dialog" class="node-dialog" aria-labelledby="dialog-title">
      <form id="node-form" method="dialog" novalidate>
        <header class="dialog-header">
          <div>
            <p class="eyebrow">Remote node</p>
            <h2 id="dialog-title">Add node</h2>
          </div>
          <button class="icon-button" id="close-dialog" type="button" aria-label="Close">×</button>
        </header>

        <div class="form-grid">
          <label class="field">
            <span>Name</span>
            <input id="node-name" name="name" required autocomplete="off" />
            <small class="field-error" data-error-for="name"></small>
          </label>

          <label class="field">
            <span>Base URL</span>
            <input id="node-url" name="baseUrl" type="url" inputmode="url" required placeholder="https://node.example.test" autocomplete="url" />
            <small class="field-error" data-error-for="baseUrl"></small>
          </label>

          <label class="field">
            <span>Credential</span>
            <input id="node-credential" name="credential" type="password" autocomplete="new-password" />
            <small id="credential-help">Leave blank while editing to preserve the configured credential.</small>
          </label>

          <label class="check-field">
            <input id="node-enabled" name="enabled" type="checkbox" checked />
            <span>Enabled</span>
          </label>

          <label class="check-field" id="clear-credential-field" hidden>
            <input id="clear-credential" name="clearCredential" type="checkbox" />
            <span>Clear the configured credential</span>
          </label>
        </div>

        <div id="form-error" class="feedback feedback-error" role="alert" hidden></div>

        <footer class="dialog-actions">
          <button class="button button-secondary" id="cancel-dialog" type="button">Cancel</button>
          <button class="button button-primary" id="save-node" type="submit">Save node</button>
        </footer>
      </form>
    </dialog>

    <script src="./remote-nodes.js"></script>
  </body>
</html>
